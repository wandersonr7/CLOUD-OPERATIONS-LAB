services:
  operations-lab:
    build: .
    container_name: cloud-operations-lab
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s